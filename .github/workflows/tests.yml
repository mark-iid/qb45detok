name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run the tests
        # The corpus is matched pairs of files saved twice by QuickBASIC and
        # is not distributed, so the tests that need it skip here. What runs
        # is the format-level work, which needs no corpus.
        run: pytest -q
      - name: Check the command line works
        run: qb45detok --help
